<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>AIBox WebRTC Multi (2cam)</title>
<meta http-equiv="Cache-Control" content="no-store">
<style>
body{font:13px monospace;background:#111;color:#0f0;margin:12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{border:1px solid #0a0;padding:6px}
video{width:100%;background:#000;aspect-ratio:16/10;object-fit:contain}
button{padding:6px 10px;margin:2px;font:bold 12px monospace;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
input{padding:4px;font:12px monospace;width:220px}
#log{max-height:180px;overflow:auto;background:#222;padding:6px;margin-top:8px}
.l{color:#0f0}.e{color:#f00}.w{color:#ff0}
.meta{color:#8f8;font-size:11px;margin:4px 0}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:4px 0}
</style></head><body>
<h2>AIBox WebRTC Multi Preview (2cam)</h2>
<div class="meta" id="buildMeta">build-id: …</div>
<p class="row">NATS: <input id="natsUrl" value="">
<button id="btnStartAll" onclick="startAll()">Start All</button>
<button id="btnCloseAll" onclick="closeAll()">Close All</button>
<span id="orderHint"></span></p>
<div class="grid" id="grid"></div>
<div id="log"></div>
<script type="module">
import {connect,StringCodec} from './nats.js';
document.getElementById('natsUrl').value=`ws://${window.location.hostname||'127.0.0.1'}:8443`;
const sc=StringCodec();
const BUILD_ID='phase-c-run-forever';
const REAL_TIMEOUT_MS=25000;
const STAGGER_MS=250;
const RECONNECT_BASE_MS=1000;
const RECONNECT_MAX_MS=15000;
const ICE_DISCONNECT_GRACE_MS=2500;
const CAMS=['cam-001','cam-002'];

document.getElementById('buildMeta').textContent=
  `build-id: ${BUILD_ID} | REAL_TIMEOUT_MS=${REAL_TIMEOUT_MS} | ?order=003-first|003-middle|003-last`;

function parseOrder(){
  const q=new URLSearchParams(location.search);
  const order=(q.get('order')||'natural').toLowerCase();
  let cams=[...CAMS];
  if(order==='003-first'||order==='009-first'){
    cams=['cam-003',...CAMS.filter(c=>c!=='cam-003')];
  }else if(order==='003-middle'||order==='009-middle'){
    const mid=Math.floor(CAMS.length/2);
    cams=[...CAMS.filter(c=>c!=='cam-003')];
    cams.splice(mid,0,'cam-003');
  }else if(order==='003-last'||order==='009-last'){
    cams=[...CAMS.filter(c=>c!=='cam-003'),'cam-003'];
  }
  document.getElementById('orderHint').textContent=`order=${order} → ${cams.join(',')}`;
  return {order,cams};
}
const {order:START_ORDER,cams:ORDERED_CAMS}=parseOrder();

function L(m,c){
  const d=document.getElementById('log');
  d.innerHTML+=`<span class="${c||'l'}">${new Date().toISOString().substr(11,8)} ${m}</span><br>`;
  d.scrollTop=d.scrollHeight;
}

function newSessionId(cam){
  try{return `multi-${cam}-${crypto.randomUUID()}`;}
  catch(_){return `multi-${cam}-${Date.now()}-${Math.random().toString(16).slice(2)}`;}
}

let sharedNc=null;
let sharedNcPromise=null;
async function ensureNc(){
  if(sharedNc) return sharedNc;
  if(sharedNcPromise) return sharedNcPromise;
  const url=document.getElementById('natsUrl').value;
  sharedNcPromise=connect({servers:url}).then(nc=>{
    sharedNc=nc;
    sharedNcPromise=null;
    L('NATS shared connect ok');
    return nc;
  }).catch(e=>{
    sharedNcPromise=null;
    throw e;
  });
  return sharedNcPromise;
}
async function publishClose(nc, cam, sessionId, reason){
  if(!nc||!sessionId) return false;
  try{
    await nc.publish(`webrtc.cam.${cam}.session.${sessionId}.close`,
      sc.encode(JSON.stringify({camera_id:cam,session_id:sessionId,reason:reason||'close'})));
    await nc.flush();
    return true;
  }catch(e){
    L(`${cam} close publish FAIL ${e}`,'e');
    return false;
  }
}
function publishCloseSync(nc, cam, sessionId, reason){
  if(!nc||!sessionId) return;
  try{
    nc.publish(`webrtc.cam.${cam}.session.${sessionId}.close`,
      sc.encode(JSON.stringify({camera_id:cam,session_id:sessionId,reason:reason||'close'})));
  }catch(_){}
}

/** Per-camera state machine (Phase0.3 / P0-5 / P0-6). */
class CamCtrl{
  constructor(cam){
    this.cam=cam;
    this.desiredOn=false;
    this.generation=0;
    this.state='idle'; // idle|starting|playing|stopping|error
    this.sessionId=null;
    this.nc=null;
    this.pc=null;
    this.sub=null;
    this.realTimer=null;
    this.gotReal=false;
    this.answeredReal=false;
    this.ice='new';
    this.hasTrack=false;
    this.opPromise=Promise.resolve();
    this.reconnectTimer=null;
    this.iceDeadTimer=null;
    this.reconnectAttempt=0;
    this._buildTile();
  }
  _clearReconnect(){
    if(this.reconnectTimer){clearTimeout(this.reconnectTimer); this.reconnectTimer=null;}
    if(this.iceDeadTimer){clearTimeout(this.iceDeadTimer); this.iceDeadTimer=null;}
  }
  _scheduleReconnect(why){
    if(!this.desiredOn) return;
    if(document.hidden) return;
    if(this.reconnectTimer) return;
    const delay=Math.min(RECONNECT_MAX_MS, RECONNECT_BASE_MS*Math.pow(2, this.reconnectAttempt));
    const gen=this.generation;
    L(`${this.cam} auto-resub in ${delay}ms attempt=${this.reconnectAttempt+1} why=${why} gen=${gen}`,'w');
    this.reconnectTimer=setTimeout(async()=>{
      this.reconnectTimer=null;
      if(!this.desiredOn || this.generation!==gen){
        L(`${this.cam} auto-resub dropped stale gen=${gen} now=${this.generation}`,'w');
        return;
      }
      this.reconnectAttempt++;
      try{ await this.start({manual:false}); }
      catch(e){
        L(`${this.cam} auto-resub ERR ${e}`,'e');
        this._scheduleReconnect('start_fail');
      }
    }, delay);
  }
  _beginAutoResub(why){
    if(!this.desiredOn) return;
    if(document.hidden) return;
    if(this.state==='starting'||this.state==='stopping') return;
    L(`${this.cam} ${why} -> auto-resub`,'w');
    this.stop(why,{manual:false}).then(()=>this._scheduleReconnect(why));
  }
  _buildTile(){
    const div=document.createElement('div'); div.className='tile'; div.id='tile-'+this.cam;
    div.innerHTML=`<div class="row"><b>${this.cam}</b>
      <button id="btn-${this.cam}" onclick="window.__toggleCam('${this.cam}')">Start</button>
      <span id="st-${this.cam}">idle</span></div>
      <video id="v-${this.cam}" autoplay playsinline muted></video>`;
    document.getElementById('grid').appendChild(div);
  }
  _setState(s){
    this.state=s;
    const el=document.getElementById('st-'+this.cam);
    if(el) el.textContent=s+(this.ice&&s==='playing'?` ICE ${this.ice}`:'');
    const btn=document.getElementById('btn-'+this.cam);
    if(btn){
      const on=this.desiredOn && (s==='starting'||s==='playing');
      btn.textContent=on?'Stop':'Start';
      btn.disabled=(s==='starting'||s==='stopping');
    }
  }
  enqueue(fn){
    this.opPromise=this.opPromise.then(fn,fn);
    return this.opPromise;
  }
  async toggle(){
    if(this.desiredOn) await this.stop('user_stop',{manual:true});
    else await this.start({manual:true});
  }
  async start(opts={}){
    return this.enqueue(async()=>{
      if(this.desiredOn && (this.state==='starting'||this.state==='playing')) return; // idempotent
      this.desiredOn=true;
      const gen=++this.generation;
      this._setState('starting');
      try{
        await this._open(gen);
        if(gen!==this.generation||!this.desiredOn){
          await this._cleanup(gen,'superseded');
          return;
        }
        this._setState(this.hasTrack?'playing':'starting');
      }catch(e){
        L(`${this.cam} start ERR ${e}`,'e');
        await this._cleanup(gen,'start_fail');
        if(gen===this.generation){
          this._setState('error');
          if(opts.manual) this.desiredOn=false;
          else this._scheduleReconnect('start_fail');
        }
      }
    });
  }
  async stop(reason='user_stop', opts={}){
    return this.enqueue(async()=>{
      // Manual stop: clear desiredOn and bump generation so async cannot recreate.
      if(opts.manual){
        this.desiredOn=false;
        this._clearReconnect();
      }
      const gen=++this.generation; // invalidate in-flight callbacks first
      this._setState('stopping');
      await this._cleanup(gen, reason);
      if(gen===this.generation) this._setState('idle');
    });
  }
  async _open(gen){
    const cam=this.cam;
    const sessionId=newSessionId(cam);
    this.sessionId=sessionId;
    this.gotReal=false;
    this.answeredReal=false;
    this.hasTrack=false;
    this.ice='new';

    const nc=await ensureNc();
    if(gen!==this.generation) return;
    this.nc=nc;
    const sub=nc.subscribe(`webrtc.cam.${cam}.session.${sessionId}.>`);
    this.sub=sub;
    const pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
    this.pc=pc;
    const v=document.getElementById('v-'+cam);

    this.realTimer=setTimeout(async()=>{
      if(gen!==this.generation||this.gotReal) return;
      L(`${cam} REAL offer timeout (${REAL_TIMEOUT_MS/1000}s)`,'e');
      this.desiredOn=false;
      await this.stop('real_timeout');
    }, REAL_TIMEOUT_MS);

    pc.ontrack=e=>{
      if(gen!==this.generation) return;
      this.hasTrack=true;
      v.srcObject=e.streams[0]||new MediaStream([e.track]);
      v.play().catch(()=>{});
      this._setState('playing');
      L(`${cam} track`);
    };
    pc.onicecandidate=e=>{
      if(gen!==this.generation||!e.candidate||!this.nc) return;
      this.nc.publish(`webrtc.cam.${cam}.session.${sessionId}.ice.remote`,
        sc.encode(JSON.stringify({camera_id:cam,session_id:sessionId,
          sdpMid:e.candidate.sdpMid||'',sdpMLineIndex:e.candidate.sdpMLineIndex||0,
          candidate:e.candidate.candidate})));
    };
    pc.oniceconnectionstatechange=()=>{
      if(gen!==this.generation) return;
      this.ice=pc.iceConnectionState;
      this._setState(this.state==='playing'||this.hasTrack?'playing':this.state);
      L(`${cam} ICE ${this.ice}`,'w');
      if(this.ice==='connected'||this.ice==='completed'){
        if(this.iceDeadTimer){clearTimeout(this.iceDeadTimer); this.iceDeadTimer=null;}
        this.reconnectAttempt=0;
        return;
      }
      if(this.ice==='disconnected'){
        if(this.iceDeadTimer) return;
        this.iceDeadTimer=setTimeout(()=>{
          this.iceDeadTimer=null;
          if(gen!==this.generation||!this.desiredOn) return;
          if(!this.pc) return;
          const st=this.pc.iceConnectionState;
          if(st==='disconnected'||st==='failed') this._beginAutoResub('ice_'+st);
        }, ICE_DISCONNECT_GRACE_MS);
        return;
      }
      if(this.ice==='failed') this._beginAutoResub('ice_failed');
    };

    nc.publish(`webrtc.cam.${cam}.session.new`,
      sc.encode(JSON.stringify({camera_id:cam,session_id:sessionId,
        ice_servers:[{url:'stun:stun.l.google.com:19302'}]})));
    L(`${cam} session.new gen=${gen}`);

    (async()=>{
      try{
        for await(const m of sub){
          if(gen!==this.generation) break;
          const d=JSON.parse(sc.decode(m.data));
          const subj=m.subject;
          if(subj.endsWith('.offer')){
            const n=(d.sdp||'').length;
            if(n<200){ L(`${cam} offer ${n}B [STUB ignored]`,'w'); continue; }
            if(this.answeredReal){ L(`${cam} offer ${n}B [dup ignored]`,'w'); continue; }
            this.gotReal=true;
            if(this.realTimer){clearTimeout(this.realTimer); this.realTimer=null;}
            L(`${cam} offer ${n}B [REAL]`);
            await pc.setRemoteDescription({type:'offer',sdp:d.sdp});
            if(gen!==this.generation) break;
            const ans=await pc.createAnswer();
            if(gen!==this.generation) break;
            await pc.setLocalDescription(ans);
            if(gen!==this.generation) break;
            nc.publish(`webrtc.cam.${cam}.session.${sessionId}.answer`,
              sc.encode(JSON.stringify({camera_id:cam,session_id:sessionId,sdpType:'answer',sdp:ans.sdp})));
            this.answeredReal=true;
            L(`${cam} answer ${ans.sdp.length}B`);
          }else if(subj.endsWith('.ice.local')&&d.candidate){
            if(gen!==this.generation) break;
            await pc.addIceCandidate({sdpMid:d.sdpMid,sdpMLineIndex:d.sdpMLineIndex,candidate:d.candidate});
          }
        }
      }catch(e){
        if(gen===this.generation) L(`${cam} sub ERR ${e}`,'e');
      }
    })();
  }
  /** Only tear down resources that still belong to gen (or current if matching session). */
  async _cleanup(gen, reason){
    if(this.realTimer){clearTimeout(this.realTimer); this.realTimer=null;}
    if(this.iceDeadTimer){clearTimeout(this.iceDeadTimer); this.iceDeadTimer=null;}
    const sessionId=this.sessionId;
    const nc=this.nc;
    const pc=this.pc;
    // Drop local refs only if still this generation's session.
    if(this.generation===gen || this.sessionId===sessionId){
      this.sessionId=null;
      this.nc=null;
      this.pc=null;
      this.sub=null;
    }
    try{pc&&pc.close()}catch(_){}
    if(nc&&sessionId){
      const ok=await publishClose(nc, this.cam, sessionId, reason||'close');
      if(!ok) L(`${this.cam} close not flushed sid=${sessionId}`,'e');
    }
    const v=document.getElementById('v-'+this.cam);
    if(v) v.srcObject=null;
  }
}

const ctrls={};
for(const cam of CAMS) ctrls[cam]=new CamCtrl(cam);

window.__toggleCam=cam=>ctrls[cam]&&ctrls[cam].toggle();
window.__multi={cams:CAMS, ordered:ORDERED_CAMS, order:START_ORDER, ctrls,
  busy:()=>Object.values(ctrls).some(c=>c.state==='starting'||c.state==='stopping')};

window.startAll=async()=>{
  if(Object.values(ctrls).some(c=>c.state==='stopping')){
    L('Start All blocked: a cam is still stopping','w');
    return;
  }
  L(`Start All (order=${START_ORDER}) - only cams not already on`);
  for(let i=0;i<ORDERED_CAMS.length;i++){
    const cam=ORDERED_CAMS[i];
    const c=ctrls[cam];
    if(c.desiredOn && (c.state==='starting'||c.state==='playing')) continue;
    try{await c.start({manual:true});}catch(e){L(`${cam} ERR ${e}`,'e');}
    if(i+1<ORDERED_CAMS.length) await new Promise(r=>setTimeout(r,STAGGER_MS));
  }
};
window.closeAll=async(silent)=>{
  for(const cam of CAMS){
    const c=ctrls[cam];
    c.desiredOn=false;
    await c.stop('multi_close',{manual:true});
  }
  if(!silent) L('Close All','w');
};

window.__multiSample=()=>{
  const out={};
  for(const cam of CAMS){
    const v=document.getElementById('v-'+cam);
    if(!v||!v.videoWidth){out[cam]=null; continue;}
    out[cam]={cam,w:v.videoWidth,h:v.videoHeight,desiredOn:ctrls[cam].desiredOn,state:ctrls[cam].state};
  }
  return out;
};
window.__multiAuto=async()=>{await startAll();};

// Visibility: only restore cams that were desiredOn before hide.
let hideTimer=null, savedDesired=null;
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden){
    if(hideTimer) return;
    hideTimer=setTimeout(async()=>{
      hideTimer=null;
      savedDesired={};
      for(const cam of CAMS) savedDesired[cam]=!!ctrls[cam].desiredOn;
      if(Object.values(savedDesired).some(Boolean)){
        L('hidden >5s -> close (keep desiredOn map)','w');
        for(const cam of CAMS){
          if(ctrls[cam].desiredOn) await ctrls[cam].stop('hidden',{manual:false});
        }
      }
    },5000);
  }else{
    if(hideTimer){clearTimeout(hideTimer); hideTimer=null;}
    if(savedDesired){
      const map=savedDesired; savedDesired=null;
      L('visible -> restore previously desiredOn cams only');
      (async()=>{
        for(let i=0;i<ORDERED_CAMS.length;i++){
          const cam=ORDERED_CAMS[i];
          if(!map[cam]) continue;
          await ctrls[cam].start({manual:true});
          await new Promise(r=>setTimeout(r,STAGGER_MS));
        }
      })();
    }
  }
});

function flushClosesOnUnload(){
  const nc=sharedNc;
  if(!nc) return;
  for(const cam of CAMS){
    const c=ctrls[cam];
    if(!c.sessionId) continue;
    publishCloseSync(nc, cam, c.sessionId, 'client_disconnect');
  }
  try{nc.flush();}catch(_){}
}
window.addEventListener('pagehide', flushClosesOnUnload);
window.addEventListener('beforeunload', flushClosesOnUnload);
</script>
</body></html>
